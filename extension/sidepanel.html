<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Side-panel structure and controls; behavior is defined in sidepanel.js. -->
    <title>Research Assistant</title>
    <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h2>Research Assistant</h2>
        </div>
        <div class="actions">
            <button id="summarizeBtn">Summarize</button>
        </div>

        <div class="notes">
            <h3>Research Notes</h3>
            <textarea id="notes" placeholder="Take notes here"></textarea>
            <button id="saveNotesBtn">Save notes</button>
        </div>

        <!-- Receives the latest generated summary or an error message. -->
        <div id="results"></div>
    </div>
    <script src="sidepanel.js"></script>
</body>
</html>
